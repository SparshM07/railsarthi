name: Cross-platform checks

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Validate LightGBM model artifact
        run: python -c "import lightgbm as lgb; from pathlib import Path; p = Path('backend/model/champion_model_scheduled_segment_v2.txt'); print(f'model exists: {p.exists()}, size: {p.stat().st_size if p.exists() else 0}'); m = lgb.Booster(model_file=str(p)); print(f'MODEL OK - trees: {m.num_trees()}')"
      - run: python -m unittest discover -s tests -v
