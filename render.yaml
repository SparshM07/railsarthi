services:
  - type: web
    name: railpulse-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: REQUIRE_API_KEY
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
